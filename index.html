<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業專科教室借用系統</title>
    <!-- Google Identity Services API (使用隱藏 iframe / 靜默驗證) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Flatpickr CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --border-color: #cbd5e1;
            --border-hover: #94a3b8;
            --booked-bg: #fee2e2;
            --booked-text: #991b1b;
            --selected-bg: #dbeafe;
            --selected-text: #1e40af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
            font-size: 1.8rem;
        }

        .auth-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* 教室選擇鈕卡片 */
        .classroom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 8px;
        }

        .btn-classroom {
            padding: 10px;
            border: 1px solid var(--border-color);
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-sub);
            transition: all 0.2s;
            text-align: center;
        }

        .btn-classroom:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #f0f7ff;
        }

        .btn-classroom.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 時段選取 grid */
        .periods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }

        .period-item {
            position: relative;
        }

        .period-item input[type="checkbox"] {
            display: none;
        }

        .period-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 4px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            background: #fff;
            transition: all 0.15s ease;
            user-select: none;
        }

        .period-item input[type="checkbox"]:checked + .period-label {
            background-color: var(--selected-bg);
            color: var(--selected-text);
            border-color: var(--primary);
            font-weight: bold;
        }

        .period-item.booked .period-label {
            background-color: var(--booked-bg);
            color: var(--booked-text);
            border-color: #fca5a5;
            cursor: not-allowed;
            text-decoration: line-through;
            opacity: 0.7;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .list-section {
            margin-top: 40px;
            border-top: 2px solid #e2e8f0;
            padding-top: 20px;
        }

        /* 儀表板搜尋與篩選 */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-bar input, .filter-bar select {
            flex: 1;
            min-width: 140px;
        }

        /* 預約紀錄表單風格 */
        .booking-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .booking-table th, .booking-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .booking-table th {
            background-color: #f1f5f9;
            color: var(--text-sub);
            font-weight: 600;
        }

        .period-tag {
            display: inline-block;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 4px;
            margin-bottom: 2px;
        }

        /* 日期選擇膠囊標籤 */
        .selected-dates-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            min-height: 38px;
            padding: 6px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            background: #fafafa;
        }

        .date-chip {
            display: inline-flex;
            align-items: center;
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.88rem;
            font-weight: 500;
            border: 1px solid #bae6fd;
        }

        .date-chip .btn-remove-date {
            margin-left: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #0284c7;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }

        .date-chip .btn-remove-date:hover {
            background-color: #0369a1;
            color: #fff;
        }

        .flatpickr-calendar {
            font-family: inherit;
        }

        /* 預約成功彈窗風格 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            width: 90%;
            max-width: 460px;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            transform: translateY(20px);
            transition: transform 0.25s ease;
            text-align: center;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-icon {
            width: 56px;
            height: 56px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 16px;
        }

        .modal-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .modal-body {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 24px;
            text-align: left;
            background: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .modal-body p {
            margin: 6px 0;
        }

        .modal-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-btn:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="auth-bar">
        <div id="userInfo" class="user-info">
            <span id="userName" style="font-weight: 600; color: var(--text-sub);">載入使用者集中管理資料...</span>
        </div>
    </div>

    <h1>專業專科教室借用登記</h1>

    <form id="bookingForm">
        <!-- 1. 借用人姓名 (含快速選單) -->
        <div class="form-group">
            <label for="borrower">借用人姓名：</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="borrower" placeholder="請選擇或輸入姓名" required list="teacherOptions" style="flex: 1;">
                <datalist id="teacherOptions">
                    <!-- JavaScript 將動態載入教師清單 -->
                </datalist>
                <select id="quickBorrowerSelect" style="width: auto; max-width: 200px;" onchange="applyQuickBorrower(this.value)">
                    <option value="">-- 快速選擇 --</option>
                </select>
            </div>
        </div>

        <!-- 2. 借用教室 (改為按鈕顯示) -->
        <div class="form-group">
            <label>借用教室：</label>
            <div class="classroom-grid" id="classroomGrid">
                <!-- Javascript 動態載入教室按鈕 -->
            </div>
            <!-- 備用下拉選單 -->
            <select id="classroom" required style="display: none;" onchange="onClassroomChange()">
                <option value="">-- 請選擇教室 --</option>
            </select>
        </div>

        <!-- 3. 多日期選取 -->
        <div class="form-group">
            <label>借用日期 (可多選)：</label>
            <div style="display: flex; gap: 8px; align-items: center;">
                <input type="text" id="datePickerInput" placeholder="點擊選擇日期..." readonly style="background-color: #fff; cursor: pointer;">
                <button type="button" onclick="clearSelectedDates()" style="padding: 10px 14px; border: 1px solid var(--border-color); background: #fff; border-radius: 6px; cursor: pointer; white-space: nowrap;">清空日期</button>
            </div>
            <div class="selected-dates-container" id="selectedDatesContainer">
                <span style="color: #94a3b8; font-size: 0.88rem; align-self: center;">尚未選擇日期</span>
            </div>
        </div>

        <!-- 4. 借用節次 -->
        <div class="form-group">
            <label>借用時段/節次 (可複選)：</label>
            <div class="periods-grid" id="periodsContainer">
                <!-- Javascript 動態生成 10 個時段 -->
            </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">確認提交借用登記</button>
    </form>

    <!-- 儀表板與預約清單 -->
    <div class="list-section">
        <h2 style="font-size: 1.3rem; margin-bottom: 16px; color: var(--text-main);">目前教室借用紀錄預覽</h2>
        
        <div class="filter-bar">
            <input type="text" id="filterKeyword" placeholder="搜尋借用人或教室..." oninput="renderDashboard()">
            <select id="filterClassroom" onchange="renderDashboard()">
                <option value="">所有教室</option>
            </select>
            <input type="date" id="filterDate" onchange="renderDashboard()">
            <button onclick="resetFilters()" style="padding: 8px 12px; border: 1px solid var(--border-color); background: #fff; border-radius: 6px; cursor: pointer;">重設篩選</button>
        </div>

        <div style="overflow-x: auto;">
            <table class="booking-table">
                <thead>
                    <tr>
                        <th>借用日期</th>
                        <th>教室名稱</th>
                        <th>借用節次</th>
                        <th>借用人</th>
                        <th>登記帳號</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="bookingTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-sub);">資料載入中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 成功提示彈窗 UI -->
<div class="modal-overlay" id="successModal">
    <div class="modal-card">
        <div class="modal-icon">✓</div>
        <div class="modal-title">預約登記成功！</div>
        <div class="modal-body" id="modalContent">
            <!-- 動態插入登記資訊 -->
        </div>
        <button class="modal-btn" onclick="closeSuccessModal()">確定並繼續</button>
    </div>
</div>

<script>
    // ==========================================
    // 全域變數與設定
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwdHMB4kJRk-TtzDZN4-yiY0xW7-wGQgDNHU29-9P5v289JKx05yIB1LdKsm26a6jSCAQ/exec";
    const CLIENT_ID = "1041838891632-15a00445a6c11612a48a.apps.googleusercontent.com"; 

    const PERIOD_LIST = ["早自習", "第一節", "第二節", "第三節", "第四節", "午休", "第五節", "第六節", "第七節", "第八節"];
    
    let classroomsList = ["電腦教室(一)", "電腦教室(二)", "創客教室", "理化實驗室", "音樂教室"];
    let teachersList = [];
    let bookings = []; 
    let currentUser = null; 
    let selectedDatesList = []; 
    let flatpickrInstance = null;

    // 格式化日期安全轉字串
    function formatSafeDate(d) {
        if (!d) return '';
        if (typeof d === 'string') return d;
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    // ==========================================
    // 初始化與頁面載入
    // ==========================================
    window.onload = async function() {
        renderPeriodsInputs();
        initFlatpickr();
        initGoogleIdentity();
        
        // 先讀取 LocalStorage 快取立即渲染
        loadLocalCache();
        
        // 同時向後端非同步同步最新資料
        await syncSystemData();
    };

    // 快取機制
    function loadLocalCache() {
        const cachedBookings = localStorage.getItem('cached_bookings');
        const cachedConfig = localStorage.getItem('cached_config');

        if (cachedConfig) {
            try {
                const config = JSON.parse(cachedConfig);
                classroomsList = config.classrooms || classroomsList;
                teachersList = config.teachers || teachersList;
                updateClassroomUI();
                updateTeacherUI();
            } catch(e) { console.error("快取配置解析失敗", e); }
        } else {
            updateClassroomUI();
        }

        if (cachedBookings) {
            try {
                bookings = JSON.parse(cachedBookings);
                renderDashboard();
                updateOccupiedPeriods();
            } catch(e) { console.error("快取預約資料解析失敗", e); }
        }
    }

    // 發送 GET 同步後端資料
    async function syncSystemData() {
        try {
            const res = await fetch(`${GAS_URL}?action=getInitialData`);
            const data = await res.json();
            
            if (data.status === 'success') {
                if (data.classrooms) classroomsList = data.classrooms;
                if (data.teachers) teachersList = data.teachers;
                if (data.bookings) bookings = data.bookings;

                localStorage.setItem('cached_config', JSON.stringify({
                    classrooms: classroomsList,
                    teachers: teachersList
                }));
                localStorage.setItem('cached_bookings', JSON.stringify(bookings));

                updateClassroomUI();
                updateTeacherUI();
                renderDashboard();
                updateOccupiedPeriods();
            }
        } catch (error) {
            console.error("同步後端失敗:", error);
        }
    }

    async function loadBookingsFromServer(forceRefresh = false) {
        await syncSystemData();
    }

    // ==========================================
    // UI 渲染與互動
    // ==========================================
    function updateClassroomUI() {
        const grid = document.getElementById('classroomGrid');
        const select = document.getElementById('classroom');
        
        grid.innerHTML = '';
        select.innerHTML = '<option value="">-- 請選擇教室 --</option>';

        classroomsList.forEach(room => {
            const btn = document.createElement('div');
            btn.className = 'btn-classroom';
            btn.textContent = room;
            btn.onclick = () => selectClassroomBtn(room);
            grid.appendChild(btn);

            const opt = document.createElement('option');
            opt.value = room;
            opt.textContent = room;
            select.appendChild(opt);
        });

        const filterSelect = document.getElementById('filterClassroom');
        const currentFilter = filterSelect.value;
        filterSelect.innerHTML = '<option value="">所有教室</option>';
        classroomsList.forEach(room => {
            const opt = document.createElement('option');
            opt.value = room;
            opt.textContent = room;
            filterSelect.appendChild(opt);
        });
        filterSelect.value = currentFilter;
    }

    function selectClassroomBtn(roomName) {
        const select = document.getElementById('classroom');
        select.value = roomName;
        
        const btns = document.querySelectorAll('.btn-classroom');
        btns.forEach(btn => {
            if(btn.textContent === roomName) {
                btn.classList.add('selected');
            } else {
                btn.classList.remove('selected');
            }
        });

        updateOccupiedPeriods();
    }

    function showClassroomDropdown() {
        document.getElementById('classroom').style.display = 'block';
    }

    function onClassroomChange() {
        const val = document.getElementById('classroom').value;
        selectClassroomBtn(val);
    }

    function updateTeacherUI() {
        const datalist = document.getElementById('teacherOptions');
        const quickSelect = document.getElementById('quickBorrowerSelect');
        
        datalist.innerHTML = '';
        quickSelect.innerHTML = '<option value="">-- 快速選擇 --</option>';

        teachersList.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t;
            datalist.appendChild(opt);

            const optQuick = document.createElement('option');
            optQuick.value = t;
            optQuick.textContent = t;
            quickSelect.appendChild(optQuick);
        });
    }

    function applyQuickBorrower(val) {
        if (val) {
            document.getElementById('borrower').value = val;
        }
    }

    function renderPeriodsInputs() {
        const container = document.getElementById('periodsContainer');
        container.innerHTML = '';
        
        PERIOD_LIST.forEach((p, idx) => {
            const item = document.createElement('div');
            item.className = 'period-item';
            item.id = `period-item-${p}`;

            const input = document.createElement('input');
            input.type = 'checkbox';
            input.name = 'period';
            input.value = p;
            input.id = `p_${idx}`;

            const label = document.createElement('label');
            label.className = 'period-label';
            label.htmlFor = `p_${idx}`;
            label.textContent = p;

            item.appendChild(input);
            item.appendChild(label);
            container.appendChild(item);
        });
    }

    // Flatpickr 多日期初始化
    function initFlatpickr() {
        flatpickrInstance = flatpickr("#datePickerInput", {
            mode: "multiple",
            dateFormat: "Y-m-d",
            locale: "zh",
            minDate: "today",
            onChange: function(selectedDates, dateStr, instance) {
                selectedDatesList = selectedDates.map(d => formatSafeDate(d));
                renderSelectedDates();
                updateOccupiedPeriods();
            }
        });
    }

    function renderSelectedDates() {
        const container = document.getElementById('selectedDatesContainer');
        container.innerHTML = '';

        if (selectedDatesList.length === 0) {
            container.innerHTML = '<span style="color: #94a3b8; font-size: 0.88rem; align-self: center;">尚未選擇日期</span>';
            return;
        }

        selectedDatesList.sort().forEach(dateStr => {
            const chip = document.createElement('div');
            chip.className = 'date-chip';
            chip.innerHTML = `
                ${dateStr}
                <span class="btn-remove-date" onclick="removeSelectedDate('${dateStr}')">&times;</span>
            `;
            container.appendChild(chip);
        });
    }

    function removeSelectedDate(dateStr) {
        selectedDatesList = selectedDatesList.filter(d => d !== dateStr);
        if (flatpickrInstance) {
            flatpickrInstance.setDate(selectedDatesList, true);
        }
        renderSelectedDates();
        updateOccupiedPeriods();
    }

    function clearSelectedDates() {
        selectedDatesList = [];
        if (flatpickrInstance) {
            flatpickrInstance.clear();
        }
        renderSelectedDates();
        updateOccupiedPeriods();
    }

    // 動態比對並更新時段狀態
    function updateOccupiedPeriods() {
        const classroom = document.getElementById('classroom').value;

        PERIOD_LIST.forEach(p => {
            const item = document.getElementById(`period-item-${p}`);
            const input = item.querySelector('input');
            
            item.classList.remove('booked');
            input.disabled = false;
        });

        if (!classroom || selectedDatesList.length === 0) return;

        let occupiedPeriods = new Set();

        selectedDatesList.forEach(d => {
            const safeD = formatSafeDate(d);
            bookings.forEach(b => {
                if (b.classroom === classroom && b.date === safeD) {
                    if (Array.isArray(b.periods)) {
                        b.periods.forEach(p => occupiedPeriods.add(p));
                    }
                }
            });
        });

        occupiedPeriods.forEach(p => {
            const item = document.getElementById(`period-item-${p}`);
            if (item) {
                const input = item.querySelector('input');
                item.classList.add('booked');
                input.disabled = true;
                input.checked = false;
            }
        });
    }

    // ==========================================
    // 預約提交邏輯 (一次性批次傳送)
    // ==========================================
    document.getElementById('bookingForm').onsubmit = async function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        const borrower = document.getElementById('borrower').value.trim();
        const classroom = document.getElementById('classroom').value;

        if (!borrower) {
            alert('⚠️ 請選擇或輸入「借用人姓名」！');
            document.getElementById('borrower').focus();
            return;
        }

        if (!classroom) {
            alert('⚠️ 請選擇「借用教室」！');
            showClassroomDropdown();
            return;
        }

        if (selectedDatesList.length === 0) {
            alert('⚠️ 請至少選擇一個借用日期！');
            return;
        }

        const curCheckDate = new Date();
        const todayFormatted = `${curCheckDate.getFullYear()}-${String(curCheckDate.getMonth() + 1).padStart(2, '0')}-${String(curCheckDate.getDate()).padStart(2, '0')}`;
        
        const hasPastDate = selectedDatesList.some(d => d < todayFormatted);
        if (hasPastDate) {
            alert('❌ 選擇的日期中包含過去的日期！請重新調整。');
            return;
        }

        const selectedPeriods = Array.from(document.querySelectorAll('input[name="period"]:checked')).map(cb => cb.value);
        if(selectedPeriods.length === 0) { alert('⚠️ 請至少選擇一個借用時段節次！'); return; }

        let conflictDetails = [];
        selectedDatesList.forEach(d => {
            const safeD = formatSafeDate(d);
            selectedPeriods.forEach(p => {
                const isConflicted = bookings.some(b => b.classroom === classroom && b.date === safeD && b.periods.includes(p));
                if (isConflicted) {
                    conflictDetails.push(`${safeD} (${p})`);
                }
            });
        });

        if (conflictDetails.length > 0) { 
            alert(`❌ 預約衝突！以下時段已被其他老師先一步借走：\n${conflictDetails.join('\n')}`); 
            return; 
        }

        submitBtn.disabled = true;
        submitBtn.textContent = '批次登記中...';

        const operatorName = currentUser ? `${currentUser.name} (${currentUser.email})` : "未登入使用者";

        // 打包一次性批次傳送的資料結構
        const batchItems = selectedDatesList.map(targetDate => ({
            id: Date.now() + Math.floor(Math.random() * 1000),
            borrower: borrower,
            classroom: classroom,
            date: formatSafeDate(targetDate),
            periods: selectedPeriods,
            operator: operatorName
        }));

        try {
            const payload = { 
                action: 'batchCreate', 
                items: batchItems 
            };
            
            const res = await fetch(GAS_URL, { 
                method: 'POST', 
                body: JSON.stringify(payload) 
            });
            const resData = await res.json();

            if (resData.status === 'success') {
                alert(`🎉 恭喜您，已成功完成 ${batchItems.length} 個日期的教室登記！`);
                document.getElementById('bookingForm').reset();
                selectedDatesList = [];
                renderSelectedDates();
                await loadBookingsFromServer(true);
            } else {
                alert(`⚠️ 登記失敗：${resData.message || '未知錯誤'}。請檢查連線。`);
                await loadBookingsFromServer(true);
            }
        } catch(error) {
            console.error("批次新增失敗:", error);
            alert(`⚠️ 連線失敗，無法完成批次登記。`);
            await loadBookingsFromServer(true);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '確認提交借用登記';
        }
    };

    function showSuccessModal(borrower, classroom, date, periods) {
        const modal = document.getElementById('successModal');
        const content = document.getElementById('modalContent');
        
        content.innerHTML = `
            <p><strong>借用人：</strong>${borrower}</p>
            <p><strong>借用教室：</strong>${classroom}</p>
            <p><strong>借用日期：</strong>${date}</p>
            <p><strong>借用節次：</strong>${periods.join(', ')}</p>
        `;
        
        modal.classList.add('active');
    }

    function closeSuccessModal() {
        document.getElementById('successModal').classList.remove('active');
    }

    // ==========================================
    // 儀表板繪製與篩選刪除
    // ==========================================
    function renderDashboard() {
        const tbody = document.getElementById('bookingTableBody');
        const filterKeyword = document.getElementById('filterKeyword').value.toLowerCase();
        const filterClassroom = document.getElementById('filterClassroom').value;
        const filterDate = document.getElementById('filterDate').value;

        tbody.innerHTML = '';

        let filtered = bookings.filter(b => {
            const matchKeyword = !filterKeyword || b.borrower.toLowerCase().includes(filterKeyword) || b.classroom.toLowerCase().includes(filterKeyword);
            const matchClassroom = !filterClassroom || b.classroom === filterClassroom;
            const matchDate = !filterDate || b.date === filterDate;
            return matchKeyword && matchClassroom && matchDate;
        });

        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-sub);">無符合條件的借用紀錄</td></tr>';
            return;
        }

        filtered.forEach(item => {
            const tr = document.createElement('tr');
            
            const periodsHtml = (Array.isArray(item.periods) ? item.periods : [])
                .map(p => `<span class="period-tag">${p}</span>`).join('');

            const canDelete = currentUser && (currentUser.email === item.operator || currentUser.name === item.borrower);
            const deleteBtnHtml = canDelete ? `<button class="btn-danger" onclick="deleteBooking(${item.id})">刪除</button>` : `<span style="color: #94a3b8; font-size: 0.8rem;">無權限</span>`;

            tr.innerHTML = `
                <td><strong>${item.date}</strong></td>
                <td>${item.classroom}</td>
                <td>${periodsHtml}</td>
                <td>${item.borrower}</td>
                <td style="font-size: 0.85rem; color: var(--text-sub);">${item.operator}</td>
                <td>${deleteBtnHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function resetFilters() {
        document.getElementById('filterKeyword').value = '';
        document.getElementById('filterClassroom').value = '';
        document.getElementById('filterDate').value = '';
        renderDashboard();
    }

    async function deleteBooking(id) {
        if (!confirm('⚠️ 確定要刪除此筆借用紀錄嗎？')) return;

        try {
            const payload = {
                action: 'delete',
                id: id,
                deletedBy: currentUser ? `${currentUser.name} (${currentUser.email})` : '未知使用者'
            };

            const res = await fetch(GAS_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const resData = await res.json();

            if (resData.status === 'success') {
                alert('🗑️ 已成功取消登記！');
                await loadBookingsFromServer(true);
            } else {
                alert('⚠️ 刪除失敗：' + resData.message);
            }
        } catch(error) {
            alert('⚠️ 刪除時發送網路錯誤');
        }
    }

    // ==========================================
    // Google 驗證整合 (隱藏模式 / 無縫接軌)
    // ==========================================
    function initGoogleIdentity() {
        if (typeof google === 'undefined') return;

        google.accounts.id.initialize({
            client_id: CLIENT_ID,
            callback: handleCredentialResponse,
            auto_select: true
        });

        google.accounts.id.prompt();
    }

    function handleCredentialResponse(response) {
        const payload = parseJwt(response.credential);
        if (payload) {
            currentUser = {
                name: payload.name,
                email: payload.email,
                picture: payload.picture
            };
            
            document.getElementById('userInfo').innerHTML = `
                <img src="${currentUser.picture}" class="user-avatar" alt="Avatar">
                <span style="font-weight: 600;">${currentUser.name}</span>
                <span style="font-size: 0.8rem; color: var(--text-sub);">(${currentUser.email})</span>
            `;

            renderDashboard();
        }
    }

    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }
</script>
