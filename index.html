<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教室借用預約系統</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --border-color: #e1e4e8;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9fa00;
            background: #f4f6f9;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            background: var(--secondary-color);
            padding: 15px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input {
            cursor: pointer;
        }

        .date-input-item {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .btn-secondary {
            background-color: #6c757d;
            width: auto;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-danger {
            background-color: #dc3545;
            width: auto;
            padding: 6px 12px;
            font-size: 14px;
        }

        .btn-danger:hover {
            background-color: #bd2130;
        }

        .record-list {
            margin-top: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: var(--secondary-color);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            background-color: #e2e3e5;;
            color: #383d41;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>教室借用預約系統</h1>

    <form id="bookingForm">
        <!-- 借用人 -->
        <div class="form-group">
            <label for="teacherName">借用人 / 老師姓名：</label>
            <input type="text" id="teacherName" required placeholder="請輸入姓名">
        </div>

        <!-- 教室選擇 -->
        <div class="form-group">
            <label for="classroomSelect">選擇教室：</label>
            <select id="classroomSelect" required>
                <option value="">-- 請選擇教室 --</option>
                <option value="101 電腦教室">101 電腦教室</option>
                <option value="201 多媒體教室">201 多媒體教室</option>
                <option value="301 創客教室">301 創客教室</option>
                <option value="401 會議室">401 會議室</option>
            </select>
        </div>

        <!-- 預約模式切換 -->
        <div class="form-group">
            <label for="bookingType">預約模式：</label>
            <select id="bookingType" onchange="toggleBookingType()">
                <option value="single">單日預約</option>
                <option value="multiple">多日預約 (同節次同教室)</option>
            </select>
        </div>

        <!-- 單日日期選擇區塊 -->
        <div class="form-group" id="singleDateContainer">
            <label for="bookingDate">借用日期：</label>
            <input type="date" id="bookingDate">
        </div>

        <!-- 多日日期選擇區塊 -->
        <div class="form-group hidden" id="multiDateContainer">
            <label>借用日期列表：</label>
            <div id="multiDateInputs">
                <div class="date-input-item">
                    <input type="date" class="multi-date-picker">
                    <button type="button" class="btn btn-danger" onclick="removeDateInput(this)">刪除</button>
                </div>
            </div>
            <button type="button" class="btn btn-secondary" onclick="addDateInput()" style="margin-top: 8px;">+ 新增日期</button>
        </div>

        <!-- 節次選擇 -->
        <div class="form-group">
            <label>選擇節次 (可多選)：</label>
            <div class="checkbox-group" id="periodContainer">
                <div class="checkbox-item"><input type="checkbox" name="period" value="早自習" id="p0"><label for="p0">早自習</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第一節" id="p1"><label for="p1">第一節</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第二節" id="p2"><label for="p2">第二節</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第三節" id="p3"><label for="p3">第三節</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第四節" id="p4"><label for="p4">第四節</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="午休" id="p5"><label for="p5">午休</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第五節" id="p6"><label for="p6">第五節</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第六節" id="p7"><label for="p7">第六節</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第七節" id="p8"><label for="p8">第七節</label></div>
                <div class="checkbox-item"><input type="checkbox" name="period" value="第八節" id="p9"><label for="p9">第八節</label></div>
            </div>
        </div>

        <button type="submit" class="btn">提交預約</button>
    </form>

    <!-- 預約紀錄列表 -->
    <div class="record-list">
        <h2>預約紀錄</h2>
        <table id="recordsTable">
            <thead>
                <tr>
                    <th>借用人</th>
                    <th>教室</th>
                    <th>日期</th>
                    <th>節次</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="recordsBody">
                <!-- 動態呈現紀錄 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 預約資料儲存陣列
    let bookingRecords = [];

    // 初始化設定預設日期為今天
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('bookingDate').value = today;
        document.querySelector('.multi-date-picker').value = today;
    });

    // 切換預約模式 (單日 / 多日)
    function toggleBookingType() {
        const type = document.getElementById('bookingType').value;
        const singleContainer = document.getElementById('singleDateContainer');
        const multiContainer = document.getElementById('multiDateContainer');

        if (type === 'multiple') {
            singleContainer.classList.add('hidden');
            multiContainer.classList.remove('hidden');
        } else {
            singleContainer.classList.remove('hidden');
            multiContainer.classList.add('hidden');
        }
    }

    // 多日模式：新增日期輸入欄位
    function addDateInput() {
        const container = document.getElementById('multiDateInputs');
        const newItem = document.createElement('div');
        newItem.className = 'date-input-item';
        
        const today = new Date().toISOString().split('T')[0];
        newItem.innerHTML = `
            <input type="date" class="multi-date-picker" value="${today}">
            <button type="button" class="btn btn-danger" onclick="removeDateInput(this)">刪除</button>
        `;
        container.appendChild(newItem);
    }

    // 多日模式：刪除日期輸入欄位
    function removeDateInput(button) {
        const container = document.getElementById('multiDateInputs');
        if (container.querySelectorAll('.date-input-item').length > 1) {
            button.parentElement.remove();
        } else {
            alert('多日預約至少需保留一個日期！');
        }
    }

    // 處理表單提交
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const teacherName = document.getElementById('teacherName').value.trim();
        const classroom = document.getElementById('classroomSelect').value;
        const bookingType = document.getElementById('bookingType').value;

        // 收集選取的節次
        const selectedPeriods = Array.from(document.querySelectorAll('input[name="period"]:checked'))
                                    .map(cb => cb.value);

        if (selectedPeriods.length === 0) {
            alert('請至少選擇一個節次！');
            return;
        }

        // 收集要預約的日期陣列
        let targetDates = [];
        if (bookingType === 'single') {
            const dateVal = document.getElementById('bookingDate').value;
            if (!dateVal) {
                alert('請選擇借用日期！');
                return;
            }
            targetDates.push(dateVal);
        } else {
            const dateInputs = document.querySelectorAll('.multi-date-picker');
            dateInputs.forEach(input => {
                if (input.value && !targetDates.includes(input.value)) {
                    targetDates.push(input.value);
                }
            });

            if (targetDates.length === 0) {
                alert('請選擇至少一個有效日期！');
                return;
            }
        }

        // 衝突檢查
        let conflicts = [];
        targetDates.forEach(date => {
            selectedPeriods.forEach(period => {
                const isConflicted = bookingRecords.some(record => 
                    record.classroom === classroom && 
                    record.date === date && 
                    record.period === period
                );
                if (isConflicted) {
                    conflicts.push(`${date} 的 ${period}`);
                }
            });
        });

        if (conflicts.length > 0) {
            alert(`預約失敗！以下時段已被預約：\n${conflicts.join('\n')}`);
            return;
        }

        // 無衝突，批次寫入預約資料
        let newRecordsCount = 0;
        targetDates.forEach(date => {
            selectedPeriods.forEach(period => {
                bookingRecords.push({
                    id: Date.now() + Math.random(),
                    teacherName: teacherName,
                    classroom: classroom,
                    date: date,
                    period: period
                });
                newRecordsCount++;
            });
        });

        alert(`成功新增 ${newRecordsCount} 筆預約！`);
        
        // 排序記錄（依日期排序）
        bookingRecords.sort((a, b) => new Date(a.date) - new Date(b.date));

        // 更新畫面列表與重置表單
        renderRecords();
        resetFormKeepInfo();
    });

    // 渲染預約紀錄列表
    function renderRecords() {
        const tbody = document.getElementById('recordsBody');
        tbody.innerHTML = '';

        if (bookingRecords.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">目前無預約紀錄</td></tr>';
            return;
        }

        bookingRecords.forEach(record => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${escapeHtml(record.teacherName)}</td>
                <td>${escapeHtml(record.classroom)}</td>
                <td>${record.date}</td>
                <td><span class="status-badge">${record.period}</span></td>
                <td><button class="btn btn-danger" onclick="deleteRecord('${record.id}')">取消預約</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 刪除紀錄
    function deleteRecord(id) {
        if (confirm('確定要取消此筆預約嗎？')) {
            bookingRecords = bookingRecords.filter(record => record.id != id);
            renderRecords();
        }
    }

    // 清理 XSS 輸入
    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }

    // 重置表單（保留借用人與模式，取消節次勾選）
    function resetFormKeepInfo() {
        document.querySelectorAll('input[name="period"]').forEach(cb => cb.checked = false);
    }

    // 初次載入渲染一次表格
    renderRecords();
</script>

</body>
</html>
